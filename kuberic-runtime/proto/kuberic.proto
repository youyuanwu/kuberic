syntax = "proto3";

package kuberic.level.v1;

message Epoch {
  int64 data_loss_number = 1;
  int64 configuration_number = 2;
}

enum ReplicaRole {
  REPLICA_ROLE_UNKNOWN = 0;
  REPLICA_ROLE_PRIMARY = 1;
  REPLICA_ROLE_ACTIVE_SECONDARY = 2;
  REPLICA_ROLE_IDLE_SECONDARY = 3;
  REPLICA_ROLE_NONE = 4;
}

enum AccessStatus {
  ACCESS_STATUS_UNKNOWN = 0;
  ACCESS_STATUS_GRANTED = 1;
  ACCESS_STATUS_RECONFIGURATION_PENDING = 2;
  ACCESS_STATUS_NOT_PRIMARY = 3;
  ACCESS_STATUS_NO_WRITE_QUORUM = 4;
}

enum AgentStorageState {
  AGENT_STORAGE_STATE_UNKNOWN = 0;
  AGENT_STORAGE_STATE_UNINITIALIZED = 1;
  AGENT_STORAGE_STATE_INITIALIZED = 2;
  AGENT_STORAGE_STATE_UNSAFE = 3;
}

enum TransitionKind {
  TRANSITION_KIND_UNKNOWN = 0;
  TRANSITION_KIND_BOOTSTRAP = 1;
  TRANSITION_KIND_REPLACEMENT = 2;
  TRANSITION_KIND_FAILOVER = 3;
  TRANSITION_KIND_PLANNED_SWITCHOVER = 4;
  TRANSITION_KIND_SECONDARY_SCALE_DOWN = 5;
  TRANSITION_KIND_SCALE_UP = 6;
  TRANSITION_KIND_DATA_LOSS_RECOVERY = 7;
}

enum FaultType {
  FAULT_TYPE_UNKNOWN = 0;
  FAULT_TYPE_TRANSIENT = 1;
  FAULT_TYPE_PERMANENT = 2;
}

message LoadMetric {
  string name = 1;
  int64 value = 2;
}

message BuildStatus {
  string build_id = 1;
  ReplicaIdentity target = 2;
  uint64 last_sequence = 3;
  int64 durable_lsn = 4;
  bool completed = 5;
  optional int64 catch_up_boundary_lsn = 6;
  int64 replication_boundary_lsn = 7;
}

message SwitchoverHandoff {
  string preparation_operation_id = 1;
  string request_id = 2;
  ReplicaIdentity source = 3;
  ReplicaIdentity target = 4;
  string starting_configuration_id = 5;
  int64 handoff_lsn = 6;
  Epoch starting_epoch = 7;
  uint64 preparation_generation = 8;
}

message SwitchoverPreparationId {
  string operation_id = 1;
  uint64 generation = 2;
}

message ReplicaIdentity {
  int64 replica_id = 1;
  string instance_id = 2;
  string agent_generation = 3;
}

message ConfigurationMember {
  ReplicaIdentity identity = 1;
  ReplicaRole role = 2;
}

message Configuration {
  string configuration_id = 1;
  Epoch epoch = 2;
  int64 primary_id = 3;
  repeated ConfigurationMember members = 4;
  uint32 write_quorum = 5;
}

message EffectivePolicy {
  uint32 replica_set_size = 1;
  uint32 write_quorum = 2;
  uint32 read_quorum = 3;
  uint64 failover_delay_seconds = 4;
}

message GetAgentStatusRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  int64 replica_id = 3;
  string expected_instance_id = 4;
}

message AgentStatusReport {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  string process_session_id = 4;
  AgentStorageState storage_state = 14;
  string pod_uid = 15;
  string pvc_uid = 16;
  string storage_error = 17;
  bool healthy = 18;
  int64 replica_id = 19;
  PublicV1AgentStatus public_v1 = 40;
}

message PublicV1AgentStatus {
  uint32 protocol_version = 1;
  uint64 generation = 2;
  string resource_uid = 3;
  ReplicaIdentity identity = 4;
  string process_session_id = 5;
  uint64 report_sequence = 6;
  ReplicaRole role = 7;
  AccessStatus read_status = 8;
  AccessStatus write_status = 9;
  PublicV1ProgressRole progress_role = 10;
  reserved 11, 12;
  repeated PublicV1OperationCompletion completed_operations = 13;
  optional uint32 history_recovery_extension_version = 14;
  reserved 15;
  optional uint32 public_build_evidence_extension_version = 16;
  PublicV1HistoryContext history = 17;
  PublicV1StorageIncarnation storage_incarnation = 18;
  PublicV1DataLossRecoveryStatus data_loss_recovery = 19;
  PublicV1ServiceLocation service_location = 20;
  string replicator_creation_id = 21;
  optional bool catch_up_specific_quorum = 23;
  optional string replication_address = 22;
  PublicV1OpenMode open_mode = 24;
  PublicV1ProgressQuery current_progress = 25;
  PublicV1ProgressQuery catch_up_capability = 26;
  optional string configuration_json = 27;
  repeated string active_operations_json = 28;
  repeated string retry_pending_operations_json = 29;
  optional string engine_idle_json = 30;
  repeated string remote_builds_json = 31;
}

enum PublicV1OpenMode {
  PUBLIC_V1_OPEN_MODE_UNKNOWN = 0;
  PUBLIC_V1_OPEN_MODE_NEW = 1;
  PUBLIC_V1_OPEN_MODE_EXISTING = 2;
}

message PublicV1ServiceLocation {
  uint32 protocol_version = 1;
  uint64 generation = 2;
  string resource_uid = 3;
  string operation_id = 4;
  ReplicaIdentity replica = 5;
  string process_session_id = 6;
  Epoch epoch = 7;
  uint64 revision = 8;
  string address = 9;
}

message PublicV1HistoryContext {
  string resource_uid = 1;
  uint64 protocol_generation = 2;
  string history_id = 3;
  int64 data_loss_number = 4;
}

enum PublicV1StorageKind {
  PUBLIC_V1_STORAGE_KIND_UNKNOWN = 0;
  PUBLIC_V1_STORAGE_KIND_PERSISTENT = 1;
  PUBLIC_V1_STORAGE_KIND_VOLATILE = 2;
}

message PublicV1StorageIncarnation {
  ReplicaIdentity replica = 1;
  PublicV1StorageKind kind = 2;
  string pod_uid = 3;
  string pvc_uid = 4;
  string volatile_identity = 5;
  string storage_generation = 6;
}

message PublicV1DataLossAttempt {
  string authorization_id = 1;
  string attempt_id = 2;
  string process_session_id = 3;
  string replicator_creation_id = 4;
  bool catch_up_specific_quorum = 5;
  PublicV1ReplayDisposition data_loss_replay = 6;
  Epoch epoch = 7;
  uint64 attempt_revision = 8;
}

enum PublicV1DataLossRecoveryStage {
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_UNKNOWN = 0;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_AUTHORIZED = 1;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_INVALIDATED = 2;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_CALLBACK_PROCESSING = 3;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_HISTORY_PENDING = 4;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_CONFIGURATION_PENDING = 5;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_ADMITTED = 6;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_FAILED = 7;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_REPLACEMENT_REQUIRED = 8;
  PUBLIC_V1_DATA_LOSS_RECOVERY_STAGE_RETIRED = 9;
}

message PublicV1RecoveryProgress {
  PublicV1ProgressRole role = 1;
  reserved 2, 3;
  PublicV1ProgressQuery current_progress = 4;
  PublicV1ProgressQuery catch_up_capability = 5;
}

message PublicV1ProgressQuery {
  oneof result {
    sint64 value = 1;
    bool not_ready = 2;
    string failure = 3;
    string not_queried = 4;
  }
}

message PublicV1DataLossRecoveryStatus {
  string authorization_id = 1;
  PublicV1DataLossAttempt attempt = 2;
  PublicV1HistoryContext proposed_history = 3;
  PublicV1StorageIncarnation provisional_primary = 4;
  PublicV1DataLossRecoveryStage stage = 5;
  PublicV1RecoveryProgress observed_progress = 6;
  PublicV1HistoryContext predecessor_history = 7;
  PublicV1ProviderProgressResetKind reset_scope_kind = 8;
  PublicV1StorageIncarnation retired_storage = 9;
  PublicV1ReplayDisposition authorization_replay = 10;
}

enum PublicV1ProviderProgressResetKind {
  PUBLIC_V1_PROVIDER_PROGRESS_RESET_KIND_UNKNOWN = 0;
  PUBLIC_V1_PROVIDER_PROGRESS_RESET_KIND_PRESERVE = 1;
  PUBLIC_V1_PROVIDER_PROGRESS_RESET_KIND_RESET_TO_EMPTY = 2;
  PUBLIC_V1_PROVIDER_PROGRESS_RESET_KIND_REPLACE_INCARNATION = 3;
}

enum PublicV1ProgressRole {
  PUBLIC_V1_PROGRESS_ROLE_UNKNOWN = 0;
  PUBLIC_V1_PROGRESS_ROLE_PRIMARY = 1;
  PUBLIC_V1_PROGRESS_ROLE_SECONDARY = 2;
  PUBLIC_V1_PROGRESS_ROLE_RECOVERY = 3;
}

enum PublicV1ReplayDisposition {
  PUBLIC_V1_REPLAY_DISPOSITION_UNKNOWN = 0;
  PUBLIC_V1_REPLAY_DISPOSITION_CONVERGENT = 1;
  PUBLIC_V1_REPLAY_DISPOSITION_REPEATABLE_READ = 2;
  PUBLIC_V1_REPLAY_DISPOSITION_REEVALUATE_CATCH_UP = 3;
  PUBLIC_V1_REPLAY_DISPOSITION_RETAIN_BUILD_SUCCESS_RETIRE_AMBIGUITY = 4;
  PUBLIC_V1_REPLAY_DISPOSITION_DATA_LOSS_CONVERGENT = 5;
  PUBLIC_V1_REPLAY_DISPOSITION_DATA_LOSS_REPLACE_ON_AMBIGUITY = 6;
  PUBLIC_V1_REPLAY_DISPOSITION_EXACT_REMOVAL = 7;
  PUBLIC_V1_REPLAY_DISPOSITION_CONTAINMENT = 8;
}

enum PublicV1OperationResultKind {
  PUBLIC_V1_OPERATION_RESULT_UNKNOWN = 0;
  PUBLIC_V1_OPERATION_RESULT_SUCCEEDED = 1;
  PUBLIC_V1_OPERATION_RESULT_FAILED = 2;
  PUBLIC_V1_OPERATION_RESULT_AMBIGUOUS = 3;
  PUBLIC_V1_OPERATION_RESULT_CANCELLED = 4;
  PUBLIC_V1_OPERATION_RESULT_REBUILD_REQUIRED = 5;
}

enum PublicV1RebuildKind {
  PUBLIC_V1_REBUILD_KIND_UNKNOWN = 0;
  PUBLIC_V1_REBUILD_KIND_LOCAL_PROVIDER = 1;
  PUBLIC_V1_REBUILD_KIND_REMOTE_BUILD_TARGET = 2;
}

enum PublicV1RebuildReason {
  PUBLIC_V1_REBUILD_REASON_UNKNOWN = 0;
  PUBLIC_V1_REBUILD_REASON_INCOMPATIBLE_RETAINED_HISTORY = 1;
  PUBLIC_V1_REBUILD_REASON_PROVIDER_MISMATCH = 2;
  PUBLIC_V1_REBUILD_REASON_REMOTE_COPY_CONFLICT = 3;
}

message PublicV1CapturedOperationIdentity {
  string resource_uid = 1;
  uint32 protocol_version = 2;
  uint64 generation = 3;
  Epoch epoch = 4;
  string operation_id = 5;
  uint64 revision = 6;
  string detecting_session = 7;
}

message PublicV1ReplicaRebuildRequired {
  PublicV1RebuildKind kind = 1;
  PublicV1RebuildReason reason = 2;
  PublicV1CapturedOperationIdentity operation = 3;
  ReplicaIdentity provider_replica = 4;
  ReplicaIdentity local_replica = 5;
  string local_storage = 6;
  reserved 7;
  optional string goal_json = 8;
}

message PublicV1OperationCompletion {
  string operation_id = 1;
  uint64 revision = 2;
  uint32 input_digest_version = 3;
  string input_digest_sha256 = 4;
  PublicV1ReplayDisposition replay_disposition = 5;
  PublicV1OperationResultKind result = 6;
  string detail = 7;
  PublicV1ReplicaRebuildRequired rebuild_required = 8;
  PublicV1CallKind call_kind = 9;
  string process_session_id = 10;
  PublicV1HistoryContext history = 11;
  PublicV1StorageIncarnation storage_incarnation = 12;
  string previous_configuration_id = 13;
  string current_configuration_id = 14;
  optional PublicV1CatchUpMode catch_up_mode = 15;
  optional bool catch_up_specific_quorum = 16;
  reserved 17, 18;
}

enum PublicV1CallKind {
  PUBLIC_V1_CALL_KIND_UNKNOWN = 0;
  PUBLIC_V1_CALL_KIND_INITIAL_PRIMARY = 1;
  PUBLIC_V1_CALL_KIND_FAILOVER_PROMOTION = 2;
  PUBLIC_V1_CALL_KIND_SECONDARY_EPOCH_ADVANCE = 3;
  PUBLIC_V1_CALL_KIND_OPEN = 4;
  PUBLIC_V1_CALL_KIND_ROLE = 5;
  PUBLIC_V1_CALL_KIND_EPOCH = 6;
  PUBLIC_V1_CALL_KIND_CONFIGURATION = 7;
  PUBLIC_V1_CALL_KIND_CATCH_UP = 8;
  PUBLIC_V1_CALL_KIND_PROGRESS = 9;
  PUBLIC_V1_CALL_KIND_SWAP = 10;
  PUBLIC_V1_CALL_KIND_BUILD = 11;
  PUBLIC_V1_CALL_KIND_REMOVE = 12;
  PUBLIC_V1_CALL_KIND_CLOSE = 13;
  PUBLIC_V1_CALL_KIND_ABORT = 14;
}

enum PublicV1CatchUpMode {
  PUBLIC_V1_CATCH_UP_MODE_UNKNOWN = 0;
  PUBLIC_V1_CATCH_UP_MODE_WRITE_QUORUM = 1;
  PUBLIC_V1_CATCH_UP_MODE_ALL = 2;
}

message InitializeAgentStoreCommand {
  string initialization_id = 1;
  string resource_uid = 2;
  int64 local_replica_id = 3;
  string expected_instance_id = 4;
  string expected_pod_uid = 5;
  string expected_pvc_uid = 6;
  string assigned_agent_generation = 7;
  EffectivePolicy effective_policy = 8;
  Configuration bootstrap_configuration = 9;
  ProvisioningIntent provisioning = 10;
}

message ProvisioningIntent {
  reserved 1, 2, 4, 5, 8, 9, 11;
  oneof purpose {
    ReplicaIdentity replaces = 3;
    ScaleUpProvisioning scale_up = 12;
  }
  string pod_uid = 6;
  string pvc_uid = 7;
  string operation_id = 10;
}

message ScaleUpProvisioning {
  string resource_uid = 1;
  uint64 spec_generation = 2;
  uint32 desired_replicas = 3;
  Configuration previous_configuration = 4;
  EffectivePolicy previous_policy = 5;
  EffectivePolicy current_policy = 6;
  int64 target_replica_id = 7;
}

enum BuildAuthorityKind {
  BUILD_AUTHORITY_KIND_UNSPECIFIED = 0;
  BUILD_AUTHORITY_KIND_BOOTSTRAP = 1;
  BUILD_AUTHORITY_KIND_PROVISIONING = 2;
  BUILD_AUTHORITY_KIND_FAILOVER = 3;
}

message BuildAuthority {
  string build_id = 1;
  BuildAuthorityKind kind = 2;
  ReplicaIdentity source = 3;
  ReplicaIdentity target = 4;
  Configuration current_configuration = 5;
  int64 replication_boundary_lsn = 6;
}

message EnsureConfigurationCommand {
  string operation_id = 1;
  Configuration previous_configuration = 2;
  Configuration current_configuration = 3;
  Epoch previous_epoch = 4;
  Epoch current_epoch = 5;
  EffectivePolicy effective_policy = 6;
  int64 local_replica_id = 7;
  string expected_instance_id = 8;
  string expected_agent_generation = 9;
  TransitionKind transition_kind = 10;
  bool grant_write = 11;
  bool current_only = 12;
  string retire_build_id = 13;
  AccessStatus primary_write_status = 14;
  repeated string retire_build_ids = 15;
  optional int64 failover_safe_lsn = 16;
  SwitchoverHandoff switchover_handoff = 17;
  repeated SwitchoverPreparationId retire_switchover_preparation_ids = 18;
  EffectivePolicy previous_policy = 19;
  SecondaryRemovalEvidence secondary_removal_evidence = 20;
  ScaleUpConfigurationEvidence scale_up_evidence = 21;
}

message ScaleUpIntent {
  string operation_id = 1;
  string resource_uid = 2;
  uint64 spec_generation = 3;
  uint32 desired_replicas = 4;
  Configuration previous_configuration = 5;
  Configuration current_configuration = 6;
  EffectivePolicy previous_policy = 7;
  EffectivePolicy current_policy = 8;
  ReplicaIdentity primary = 9;
  ReplicaIdentity target = 10;
  string build_id = 11;
  int64 snapshot_boundary_lsn = 12;
  int64 catch_up_boundary_lsn = 13;
}

message ScaleUpWitness {
  string resource_uid = 1;
  ReplicaIdentity identity = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  Epoch epoch = 5;
  string previous_configuration_id = 6;
  string current_configuration_id = 7;
  int64 verified_replication_lsn = 8;
  AccessStatus write_status = 9;
  string pending_operation_id = 10;
  string retained_operation_id = 11;
  ReplicaRole role = 12;
}

message ScaleUpFailoverEvidence {
  ScaleUpIntent intent = 1;
  repeated ScaleUpWitness previous_read_quorum = 2;
  repeated ScaleUpWitness current_read_quorum = 3;
  Configuration provisional_configuration = 4;
  ScaleUpFinalElectionEvidence final_election = 5;
}

message ScaleUpFinalWitness {
  int64 replica_id = 1;
  string process_session_id = 2;
  uint64 report_sequence = 3;
  int64 current_progress = 4;
  int64 committed_lsn = 5;
  int64 deactivated_lsn = 6;
  string fence_operation_id = 7;
}

message ScaleUpFinalElectionEvidence {
  int64 selected_primary_replica_id = 1;
  repeated ScaleUpFinalWitness witnesses = 2;
  repeated int64 previous_read_quorum = 3;
  repeated int64 current_read_quorum = 4;
}

message ScaleUpConfigurationEvidence {
  oneof evidence {
    ScaleUpIntent admission = 1;
    ScaleUpFailoverEvidence failover = 2;
  }
}

message ScaleUpCleanup {
  ProvisioningIntent provisioning = 1;
  ReplicaIdentity target = 2;
  ReplicaCleanupIdentity resources = 3;
}

message ScaleUpReceipt {
  ScaleUpIntent intent = 1;
  repeated ScaleUpWitness current_only_write_quorum = 2;
  Configuration accepted_configuration = 3;
  ScaleUpFailoverReceiptEvidence failover_evidence = 4;
  optional int64 failover_safe_lsn = 5;
}

message ScaleUpFailoverReceiptEvidence {
  int64 provisional_primary_replica_id = 1;
  repeated ScaleUpWitness previous_read_quorum = 2;
  repeated ScaleUpWitness current_read_quorum = 3;
  ScaleUpFinalElectionEvidence final_election = 4;
}

message CleanupResourceIdentity {
  string name = 1;
  oneof identity {
    string uid = 2;
    bool authoritatively_absent = 3;
  }
}

message ReplicaCleanupIdentity {
  CleanupResourceIdentity pod = 1;
  CleanupResourceIdentity pvc = 2;
  CleanupResourceIdentity endpoint = 3;
}

message SecondaryScaleDownIntent {
  string operation_id = 1;
  string resource_uid = 2;
  uint64 spec_generation = 3;
  uint32 desired_replicas = 4;
  Configuration previous_configuration = 5;
  Configuration current_configuration = 6;
  EffectivePolicy previous_policy = 7;
  EffectivePolicy current_policy = 8;
  ReplicaIdentity primary = 9;
  ReplicaIdentity target = 10;
  ReplicaCleanupIdentity cleanup = 11;
}

message SecondaryRemovalPreparation {
  SecondaryScaleDownIntent intent = 1;
  string operation_id = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  int64 boundary_lsn = 5;
}

message SecondaryRemovalWitness {
  string resource_uid = 1;
  ReplicaIdentity identity = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  Epoch epoch = 5;
  string previous_configuration_id = 6;
  string current_configuration_id = 7;
  int64 verified_replication_lsn = 8;
  AccessStatus write_status = 9;
  string pending_operation_id = 10;
  string retained_operation_id = 11;
  ReplicaRole role = 12;
}

message SecondaryRemovalEvidence {
  SecondaryRemovalPreparation preparation = 1;
  repeated SecondaryRemovalWitness previous_read_quorum = 2;
  repeated SecondaryRemovalWitness reduced_write_quorum = 3;
}

message ReplicaRetirementReport {
  SecondaryScaleDownIntent intent = 1;
  string operation_id = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  Epoch epoch = 5;
  ReplicaRole role = 6;
  AccessStatus read_status = 7;
  AccessStatus write_status = 8;
  bool application_closed = 9;
  bool peers_fenced = 10;
}

message SecondaryScaleDownCleanup {
  SecondaryRemovalEvidence evidence = 1;
  repeated SecondaryRemovalWitness current_only_write_quorum = 2;
  ReplicaRetirementReport retirement = 3;
}

message PrepareSecondaryRemovalCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  SecondaryScaleDownIntent intent = 5;
}

message RetireReplicaCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  SecondaryScaleDownCleanup committed = 5;
}

message AcceptSecondaryRemovalCommitCommand {
  string operation_id = 1;
  ReplicaIdentity target = 2;
  SecondaryScaleDownCleanup committed = 3;
  bool local_recovery = 4;
}

message PrepareSwitchoverCommand {
  string operation_id = 1;
  string request_id = 2;
  int64 local_replica_id = 3;
  string expected_instance_id = 4;
  string expected_agent_generation = 5;
  ReplicaIdentity source = 6;
  ReplicaIdentity target = 7;
  Configuration current_configuration = 8;
  uint64 preparation_generation = 9;
}

message EnsureReplicaBuildCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  ReplicaIdentity target = 5;
  BuildAuthority authority = 6;
  string source_session_id = 7;
  bool retire = 8;
  reserved 9;
}

message PublicV1HistoryCommand {
  bytes canonical_json = 1;
}

message PublicV1OperationCommand {
  bytes canonical_json = 1;
}

message ExecuteCommandRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  ReplicaIdentity target = 3;
  string expected_process_session_id = 4;
  reserved 11 to 16;
  oneof command {
    InitializeAgentStoreCommand initialize_agent_store = 10;
    PublicV1HistoryCommand public_v1_history = 17;
    PublicV1OperationCommand public_v1_operation = 18;
  }
}

message ExecuteCommandResponse {
  uint32 protocol_version = 1;
  AgentStatusReport observation = 2;
}

service AgentControl {
  rpc GetStatus(GetAgentStatusRequest) returns (AgentStatusReport);
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc SubmitGoal(ReplicaGoalRequest) returns (ReplicaSnapshotResponse);
  rpc GetSnapshot(ReplicaSnapshotRequest) returns (ReplicaSnapshotResponse);
  rpc AcknowledgeGoal(ReplicaGoalRequest) returns (ReplicaSnapshotResponse);
}

service ReplicaPeer {
  rpc GetStatus(GetAgentStatusRequest) returns (AgentStatusReport);
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc Discover(ReplicaDiscoveryRequest) returns (ReplicaSnapshotResponse);
}

message ReplicaGoalRequest {
  uint32 protocol_version = 1;
  bytes canonical_json = 2;
}

message ReplicaSnapshotRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  ReplicaIdentity target = 3;
  string expected_process_session_id = 4;
  bool sample_native_progress = 5;
}

message ReplicaDiscoveryRequest {
  uint32 protocol_version = 1;
  bytes canonical_json = 2;
}

message ReplicaSnapshotResponse {
  uint32 protocol_version = 1;
  bytes canonical_json = 2;
}
