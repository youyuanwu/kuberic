name: build

on: [push, pull_request]


env:
  XEDIO_CI: true
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps:
    - uses: actions/checkout@v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
    
    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just

    - name: Install PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql postgresql-client
        # Stop the default PG service (tests manage their own instances)
        sudo systemctl stop postgresql.service || true
        pg_config --version

    - name: Run cargo check
      run: cargo check --all-targets

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Measure switchover complexity
      run: python3 scripts/measure-switchover-complexity.py
    
    - name: Run cargo clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run durable switchover measurement gates
      env:
        RUST_MIN_STACK: 4194304
      run: |
        cargo test -p kuberic-operator --features durable-switchover-pilot success_and_rollback_transcripts_fit_with_redelivery_headroom
        cargo test -p kuberic-operator --features durable-switchover-pilot maximum_projected_history_fits_both_budgets
        cargo test -p kuberic-operator --features durable-switchover-pilot measurements_ -- --nocapture
        cargo test -p kvstore --test reconciler test_durable_execution_switchover_pilot_happy_path -- --nocapture

    - name: Build all targets
      run: cargo build --all-targets

    - name: Kubernetes KinD Cluster
      id: kind
      uses: helm/kind-action@v1
      with:
        cluster_name: kind
        config: deploy/kind-config.yaml

    - name: Build and load Docker images
      run: just images

    - name: Run cargo test
      run: cargo test --all --all-features