name: checkpoint-kubernetes-real

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  KIND_VERSION: v0.31.0
  KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
  KIND_CLUSTER_NAME: checkpoint-real-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  checkpoint-kubernetes-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read Rust version
        id: rust-version
        run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned KinD CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --show-error --silent \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" \
            --output "$RUNNER_TEMP/bin/kind"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create owned KinD cluster
        run: |
          kind create cluster \
            --name "$KIND_CLUSTER_NAME" \
            --config deploy/kind-config.yaml \
            --wait 120s

      - name: Run ignored real Kubernetes checkpoint test
        run: |
          cargo test --locked \
            -p kuberic-durable-execution \
            --features kubernetes \
            --test kubernetes_checkpoint_real \
            -- --ignored --nocapture

      - name: Delete owned KinD cluster
        if: ${{ always() }}
        run: |
          if ! command -v kind >/dev/null 2>&1; then
            if docker ps -a --format '{{.Names}}' |
              grep --fixed-strings --line-regexp --quiet "${KIND_CLUSTER_NAME}-control-plane"
            then
              echo "::error::KinD CLI is unavailable while the owned cluster container remains"
              exit 1
            fi
            echo "KinD CLI was not installed and no owned cluster container exists"
            exit 0
          fi

          kind delete cluster --name "$KIND_CLUSTER_NAME"
          if kind get clusters |
            grep --fixed-strings --line-regexp --quiet "$KIND_CLUSTER_NAME"
          then
            echo "::error::Owned KinD cluster still appears after deletion"
            exit 1
          fi
          if docker ps -a --format '{{.Names}}' |
            grep --fixed-strings --line-regexp --quiet "${KIND_CLUSTER_NAME}-control-plane"
          then
            echo "::error::Owned KinD control-plane container still exists after deletion"
            exit 1
          fi
