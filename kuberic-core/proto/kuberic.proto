syntax = "proto3";
package kuberic.replication.v1;

// ---- Shared types ----

message EpochProto {
    int64 data_loss_number = 1;
    int64 configuration_number = 2;
}

enum RoleProto {
    ROLE_UNKNOWN = 0;
    ROLE_PRIMARY = 1;
    ROLE_ACTIVE_SECONDARY = 2;
    ROLE_IDLE_SECONDARY = 3;
    ROLE_NONE = 4;
}

enum ReplicaStatusProto {
    STATUS_UP = 0;
    STATUS_DOWN = 1;
}

enum QuorumModeProto {
    QUORUM_ALL = 0;
    QUORUM_WRITE = 1;
}

enum OpenModeProto {
    OPEN_NEW = 0;
    OPEN_EXISTING = 1;
}

enum AccessStatusProto {
    ACCESS_GRANTED = 0;
    ACCESS_RECONFIGURATION_PENDING = 1;
    ACCESS_NOT_PRIMARY = 2;
    ACCESS_NO_WRITE_QUORUM = 3;
}

enum ReplicaConfigurationModeProto {
    CONFIGURATION_NONE = 0;
    CONFIGURATION_CATCH_UP = 1;
    CONFIGURATION_CURRENT = 2;
}

enum DurableActionStateProto {
    DURABLE_ACTION_NONE = 0;
    DURABLE_ACTION_SCHEDULED = 1;
    DURABLE_ACTION_IN_PROGRESS = 2;
    DURABLE_ACTION_COMPLETED = 3;
    DURABLE_ACTION_FAILED = 4;
}

message ReplicaInfoProto {
    int64 id = 1;
    RoleProto role = 2;
    ReplicaStatusProto status = 3;
    string replicator_address = 4;
    int64 current_progress = 5;
    int64 catch_up_capability = 6;
    bool must_catch_up = 7;
    string instance_id = 8;
}

message ReplicaSetConfigProto {
    repeated ReplicaInfoProto members = 1;
    uint32 write_quorum = 2;
}

// ---- Control plane: Operator → Pod ----

service ReplicatorControl {
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
    rpc ExecuteCorrelatedControlAction(ExecuteCorrelatedControlActionRequest) returns (ExecuteCorrelatedControlActionResponse);
}

message OpenRequest {
    OpenModeProto mode = 1;
}

message CloseRequest {}

message ChangeRoleRequest {
    EpochProto epoch = 1;
    RoleProto role = 2;
}

message UpdateEpochRequest {
    EpochProto epoch = 1;
}

message GetStatusRequest {}
message GetStatusResponse {
    RoleProto role = 1;
    EpochProto epoch = 2;
    int64 current_progress = 3;
    optional int64 catch_up_capability = 4;
    int64 committed_lsn = 5;
    bool healthy = 6;
    string instance_id = 7;
    optional AccessStatusProto write_status = 8;
    ReplicaConfigurationStatusProto configuration = 9;
    reserved 10 to 15;
    reserved "last_completed_action_id", "last_completed_action_signature",
        "durable_action_id", "durable_action_signature", "durable_action_state",
        "durable_action_error";
    repeated ReplicaConnectionStatusProto active_replica_connections = 16;
    ReplicaDeactivationInfoProto deactivation_info = 17;
    ReplicaElectionConfigurationProto election_configuration = 18;
    reserved 19, 20;
    reserved "last_completed_action_result", "durable_action_result";
    uint32 replica_agent_protocol_version = 21;
    string agent_generation = 22;
    uint64 agent_control_version = 23;
    CorrelatedActionObservationProto current_agent_action = 24;
    repeated CorrelatedActionObservationProto retained_terminal_actions = 25;
    repeated LocalFaultRecordProto local_faults = 26;
    RuntimeBuildObservationProto build_observation = 27;
    uint32 replica_add_build_peer_protocol_version = 28;
}

message ReplicaDeactivationInfoProto {
    EpochProto epoch = 1;
    int64 catch_up_lsn = 2;
}

message ReplicaElectionConfigurationProto {
    ReplicaConfigurationStatusProto current = 1;
    ReplicaConfigurationStatusProto previous = 2;
}

enum DurableActionResultProto {
    DURABLE_ACTION_RESULT_NONE = 0;
    DURABLE_ACTION_RESULT_DATA_LOSS_NO_STATE_CHANGE = 1;
    DURABLE_ACTION_RESULT_DATA_LOSS_STATE_CHANGED = 2;
    DURABLE_ACTION_RESULT_ADD_REPLICA_COMMITTED = 3;
    DURABLE_ACTION_RESULT_ADD_REPLICA_COMPENSATED = 4;
    reserved 5;
    reserved "DURABLE_ACTION_RESULT_ADD_REPLICA_REDRIVE_REQUIRED";
    DURABLE_ACTION_RESULT_ADD_REPLICA_COMPENSATION_INCOMPLETE = 6;
    reserved 7;
    reserved "DURABLE_ACTION_RESULT_ADD_REPLICA_COMMITTED_DEGRADED";
}

enum DurableActionErrorClassProto {
    DURABLE_ACTION_ERROR_NONE = 0;
    DURABLE_ACTION_ERROR_INTERNAL = 1;
    DURABLE_ACTION_ERROR_NOT_PRIMARY = 2;
    DURABLE_ACTION_ERROR_NO_WRITE_QUORUM = 3;
    DURABLE_ACTION_ERROR_RECONFIGURATION_PENDING = 4;
    DURABLE_ACTION_ERROR_STALE_EPOCH = 5;
    DURABLE_ACTION_ERROR_CANCELLED = 6;
    DURABLE_ACTION_ERROR_CLOSED = 7;
}

message ReplicaConnectionStatusProto {
    int64 id = 1;
    string instance_id = 2;
}

message ReplicaConfigurationMemberStatusProto {
    int64 id = 1;
    string instance_id = 2;
    RoleProto role = 3;
}

message ReplicaConfigurationStatusProto {
    ReplicaConfigurationModeProto mode = 1;
    repeated ReplicaConfigurationMemberStatusProto members = 2;
    uint32 write_quorum = 3;
}

message UpdateCatchUpConfigRequest {
    ReplicaSetConfigProto current = 1;
    ReplicaSetConfigProto previous = 2;
}

message UpdateCurrentConfigRequest {
    ReplicaSetConfigProto current = 1;
}

message WaitForCatchUpQuorumRequest {
    QuorumModeProto mode = 1;
}

message BuildReplicaRequest {
    ReplicaInfoProto replica = 1;
}

message RemoveReplicaRequest {
    int64 replica_id = 1;
    string instance_id = 2;
}

message DurableOnDataLossRequest {
    EpochProto expected_epoch = 1;
}

message RevokeWriteStatusRequest {}

message RecordElectionConfigurationRequest {
    ReplicaElectionConfigurationProto configuration = 1;
}

enum LocalFaultTypeProto {
    LOCAL_FAULT_UNKNOWN = 0;
    LOCAL_FAULT_TRANSIENT = 1;
    LOCAL_FAULT_PERMANENT = 2;
}

message CorrelatedActionObservationProto {
    string agent_generation = 1;
    uint64 agent_control_version = 2;
    reserved 3;
    reserved "admission";
    string action_id = 4;
    string input_signature = 5;
    DurableActionStateProto state = 6;
    string error = 7;
    DurableActionResultProto result = 8;
    DurableActionErrorClassProto error_class = 9;
    AddReplicaProgressProto add_replica_progress = 10;
}

message LocalFaultRecordProto {
    uint64 sequence = 1;
    LocalFaultTypeProto fault_type = 2;
}

message ExecuteCorrelatedControlActionRequest {
    uint32 protocol_version = 1;
    string action_id = 2;
    string input_signature = 3;
    int64 target_replica_id = 4;
    string target_instance_id = 5;
    string expected_agent_generation = 6;
    optional uint64 expected_agent_control_version = 7;
    EpochProto observed_runtime_epoch = 8;
    oneof action {
        RevokeWriteStatusRequest revoke_write_status = 20;
        ChangeRoleRequest change_role = 21;
        UpdateEpochRequest update_epoch = 22;
        UpdateCatchUpConfigRequest update_catch_up_configuration = 23;
        WaitForCatchUpQuorumRequest wait_for_catch_up_quorum = 24;
        UpdateCurrentConfigRequest update_current_configuration = 25;
        OpenRequest open = 26;
        CloseRequest close = 27;
        BuildReplicaRequest build_replica = 28;
        RemoveReplicaRequest remove_replica = 29;
        DurableOnDataLossRequest on_data_loss = 30;
        RecordElectionConfigurationRequest record_election_configuration = 31;
        AddReplicaIntentProto add_replica_intent = 32;
    }
}

message ExecuteCorrelatedControlActionResponse {
    CorrelatedActionObservationProto observation = 1;
}

enum AddReplicaModeProto {
    ADD_REPLICA_MODE_UNKNOWN = 0;
    ADD_REPLICA_MODE_SCALE_UP = 1;
    ADD_REPLICA_MODE_REBUILD = 2;
}

enum ConfigurationProgressSourceProto {
    CONFIGURATION_PROGRESS_UNKNOWN = 0;
    CONFIGURATION_PROGRESS_FROZEN = 1;
    CONFIGURATION_PROGRESS_BUILD_COPY_LSN = 2;
}

message ConfigurationMemberDescriptorProto {
    int64 id = 1;
    string instance_id = 2;
    RoleProto role = 3;
    ReplicaStatusProto status = 4;
    string replicator_address = 5;
    bool must_catch_up = 6;
    ConfigurationProgressSourceProto progress_source = 7;
    int64 current_progress = 8;
    int64 catch_up_capability = 9;
}

message ConfigurationDescriptorProto {
    repeated ConfigurationMemberDescriptorProto members = 1;
    uint32 write_quorum = 2;
}

message AddReplicaIntentProto {
    string operation_id = 1;
    string attempt_id = 2;
    AddReplicaModeProto mode = 3;
    EpochProto epoch = 4;
    int64 primary_replica_id = 5;
    string primary_instance_id = 6;
    string primary_agent_generation = 7;
    string primary_control_address = 8;
    int64 target_replica_id = 9;
    string target_instance_id = 10;
    string target_agent_generation = 11;
    string target_control_address = 12;
    string target_replicator_address = 13;
    optional string retired_instance_id = 14;
    ConfigurationDescriptorProto previous_configuration = 15;
    ConfigurationDescriptorProto catch_up_configuration = 16;
    ConfigurationDescriptorProto current_configuration = 17;
    uint32 minimum_committed_replicas = 18;
    int64 deadline_unix_seconds = 19;
    int64 compensation_deadline_unix_seconds = 20;
}

enum AddReplicaCoordinatorPhaseProto {
    ADD_REPLICA_PHASE_UNKNOWN = 0;
    ADD_REPLICA_PHASE_VALIDATING = 1;
    ADD_REPLICA_PHASE_RETIRING_OLD_CONNECTION = 2;
    ADD_REPLICA_PHASE_PREPARING_TARGET = 3;
    ADD_REPLICA_PHASE_BUILDING = 4;
    ADD_REPLICA_PHASE_ACTIVATING_TARGET = 5;
    ADD_REPLICA_PHASE_INSTALLING_CATCH_UP_CONFIGURATION = 6;
    ADD_REPLICA_PHASE_WAITING_FOR_CATCH_UP_QUORUM = 7;
    ADD_REPLICA_PHASE_INSTALLING_CURRENT_CONFIGURATION = 8;
    ADD_REPLICA_PHASE_ATTESTING = 9;
    ADD_REPLICA_PHASE_COMPENSATING = 10;
}

message AddReplicaProgressProto {
    AddReplicaCoordinatorPhaseProto phase = 1;
    bool commit_observed = 2;
    optional int64 copy_lsn = 3;
}

enum RuntimeBuildStateProto {
    RUNTIME_BUILD_STATE_UNKNOWN = 0;
    RUNTIME_BUILD_STATE_IN_PROGRESS = 1;
    RUNTIME_BUILD_STATE_COMPLETED = 2;
    RUNTIME_BUILD_STATE_FAILED = 3;
    RUNTIME_BUILD_STATE_CANCELLED = 4;
}

message RuntimeBuildObservationProto {
    string execution_id = 1;
    string build_key = 2;
    int64 target_replica_id = 3;
    string target_instance_id = 4;
    string target_agent_generation = 5;
    RuntimeBuildStateProto state = 6;
    optional int64 copy_lsn = 7;
    optional string error = 8;
}

enum PeerStageProto {
    PEER_STAGE_UNKNOWN = 0;
    PEER_STAGE_PREPARE = 1;
    PEER_STAGE_ACTIVATE = 2;
    PEER_STAGE_CLEANUP = 3;
}

enum PeerStageStateProto {
    PEER_STAGE_STATE_UNKNOWN = 0;
    PEER_STAGE_STATE_ACCEPTED = 1;
    PEER_STAGE_STATE_IN_PROGRESS = 2;
    PEER_STAGE_STATE_COMPLETED = 3;
    PEER_STAGE_STATE_FAILED = 4;
    PEER_STAGE_STATE_STALE = 5;
}

message PeerStageObservationProto {
    uint32 protocol_version = 1;
    string message_id = 2;
    string input_signature = 3;
    PeerStageProto stage = 4;
    PeerStageStateProto state = 5;
    string target_agent_generation = 6;
    uint64 target_peer_control_version = 7;
    optional string error = 8;
}

message GetAddBuildStatusRequest {
    uint32 protocol_version = 1;
    int64 target_replica_id = 2;
    string target_instance_id = 3;
    string expected_target_agent_generation = 4;
}

message GetAddBuildStatusResponse {
    uint32 protocol_version = 1;
    int64 target_replica_id = 2;
    string target_instance_id = 3;
    string agent_generation = 4;
    uint64 peer_control_version = 5;
    RoleProto role = 6;
    EpochProto epoch = 7;
    bool healthy = 8;
    int64 current_progress = 9;
    PeerStageObservationProto current_action = 10;
    repeated PeerStageObservationProto retained_terminal_actions = 11;
}

message ExecuteAddBuildStageRequest {
    uint32 protocol_version = 1;
    string operation_id = 2;
    string attempt_id = 3;
    string message_id = 4;
    string input_signature = 5;
    PeerStageProto stage = 6;
    int64 sender_replica_id = 7;
    string sender_instance_id = 8;
    string sender_agent_generation = 9;
    string sender_control_address = 10;
    string parent_action_id = 11;
    string parent_action_signature = 12;
    int64 target_replica_id = 13;
    string target_instance_id = 14;
    string expected_target_agent_generation = 15;
    uint64 expected_target_peer_control_version = 16;
    EpochProto epoch = 17;
    string configuration_fence = 18;
    optional string build_key = 19;
    optional int64 copy_lsn = 20;
}

message ExecuteAddBuildStageResponse {
    PeerStageObservationProto observation = 1;
}

service ReplicaAddBuildPeer {
    rpc GetAddBuildStatus(GetAddBuildStatusRequest) returns (GetAddBuildStatusResponse);
    rpc ExecuteAddBuildStage(ExecuteAddBuildStageRequest) returns (ExecuteAddBuildStageResponse);
}

// ---- Data plane: Pod ↔ Pod (replication + copy) ----

service ReplicatorData {
    // Incremental replication: primary streams ops, secondary ACKs
    rpc ReplicationStream(stream ReplicationItem) returns (stream ReplicationAck);

    // Copy protocol: primary ↔ secondary during BuildReplica
    // 1. Primary calls GetCopyContext on secondary → secondary sends its context
    rpc GetCopyContext(GetCopyContextRequest) returns (GetCopyContextResponse);
    // 2. Primary streams full state to secondary
    rpc CopyStream(stream CopyItem) returns (CopyStreamResponse);
}

message ReplicationItem {
    int64 epoch_data_loss = 1;
    int64 epoch_config = 2;
    int64 lsn = 3;
    bytes data = 4;
    // Primary's current quorum-committed LSN. Secondaries use this to:
    // 1. Track which ops are committed (for UpdateEpoch rollback boundary)
    // 2. GC their internal operation queues
    // 3. Trigger deferred page application (SQLite app)
    // Matches SF's completedSequenceNumber in ReplicationOperationHeader.
    int64 committed_lsn = 5;
}

message ReplicationAck {
    int64 lsn = 1;
}

message GetCopyContextRequest {}
message GetCopyContextResponse {
    repeated RawOperation operations = 1;
}

message RawOperation {
    int64 lsn = 1;
    bytes data = 2;
}

message CopyItem {
    int64 lsn = 1;
    bytes data = 2;
    // Marks the authoritative snapshot boundary. Boundary items are protocol
    // metadata and are not forwarded to the user copy stream.
    bool is_boundary = 3;
}

message CopyStreamResponse {
    int64 items_received = 1;
}
