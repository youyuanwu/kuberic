apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberic-controller
  namespace: kuberic-system
rules:
  - apiGroups:
      - operator.kuberic.io
    resources:
      - kubericsets
      - kubericsets/status
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - pods
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberic-controller
  namespace: kuberic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberic-controller
subjects:
  - kind: ServiceAccount
    name: kuberic-controller
    namespace: kuberic-system
