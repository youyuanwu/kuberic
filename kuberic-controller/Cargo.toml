[package]
name = "kuberic-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Level-triggered Kubernetes controller for Kuberic"
readme = "README.md"

[features]
default = []
runtime-test-bridge = ["kuberic-runtime/testing"]
test-util = ["kuberic-runtime/testing", "dep:tempfile", "dep:tower", "dep:http", "dep:form_urlencoded", "dep:uuid", "dep:anyhow"]

[[bin]]
name = "kuberic-controller"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
kuberic-runtime.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = { version = "3", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
http = { version = "1", optional = true }
form_urlencoded = { version = "1", optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml_ng = "0.10"
tempfile = "3"
