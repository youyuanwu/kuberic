---
apiVersion: v1
kind: Namespace
metadata:
  name: xedio
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubericsets.kuberic.io
spec:
  group: kuberic.io
  names:
    kind: KubericSet
    listKind: KubericSetList
    plural: kubericsets
    shortNames:
    - kls
    singular: kubericset
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                default: 3
                minimum: 1
                maximum: 10
              minReplicas:
                type: integer
                default: 2
              image:
                type: string
              failoverDelay:
                type: integer
                default: 0
              switchoverDelay:
                type: integer
                default: 3600
              port:
                type: integer
                default: 8080
              controlPort:
                type: integer
                default: 9090
              dataPort:
                type: integer
                default: 9091
              storage:
                type: string
                default: "256Mi"
              pvcRetentionPolicy:
                type: string
                default: Delete
                enum:
                - Delete
                - Retain
          status:
            type: object
            properties:
              epoch:
                type: object
                properties:
                  dataLossNumber:
                    type: integer
                  configurationNumber:
                    type: integer
              currentPrimary:
                type: string
              targetPrimary:
                type: string
              phase:
                type: string
              reconfigurationPhase:
                type: string
              readyReplicas:
                type: integer
              replicas:
                type: integer
              primaryFailingSince:
                type: string
              members:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    id:
                      type: integer
                    instanceId:
                      type: string
                    role:
                      type: string
                    currentProgress:
                      type: integer
                    healthy:
                      type: boolean
                    controlAddress:
                      type: string
                    dataAddress:
                      type: string
              stableSnapshot:
                type: object
                required:
                - epoch
                - primaryId
                - members
                - writeQuorum
                properties:
                  epoch:
                    type: object
                    required:
                    - dataLossNumber
                    - configurationNumber
                    properties:
                      dataLossNumber:
                        type: integer
                        format: int64
                      configurationNumber:
                        type: integer
                        format: int64
                  primaryId:
                    type: integer
                    format: int64
                  members:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - instanceId
                      - role
                      properties:
                        id:
                          type: integer
                          format: int64
                        instanceId:
                          type: string
                        role:
                          type: string
                          enum:
                          - primary
                          - activeSecondary
                  writeQuorum:
                    type: integer
                    format: uint32
                    minimum: 0
              operation:
                type: object
                required:
                - operationId
                - executionId
                - version
                - kind
                - phase
                - previousSnapshot
                - targetSnapshot
                - oldPrimaryId
                - targetPrimaryId
                - nextSecondaryIndex
                - phaseDeadlineUnixSeconds
                properties:
                  operationId:
                    type: string
                  executionId:
                    type: string
                  version:
                    type: integer
                    format: uint32
                  kind:
                    type: string
                    enum:
                    - switchover
                    - addReplica
                  phase:
                    type: string
                    enum:
                    - revoke
                    - captureLsn
                    - preCatchUp
                    - demoteOldPrimary
                    - promoteTarget
                    - distributeEpoch
                    - updateCatchUpConfiguration
                    - waitForCatchUpQuorum
                    - updateCurrentConfiguration
                    - labelTargetPrimary
                    - labelOldSecondary
                    - finalize
                    - restorePreviousConfiguration
                    - compensatePromoteOldPrimary
                    - compensateDistributeEpoch
                    - compensateCatchUpConfiguration
                    - compensateCurrentConfiguration
                    - compensateLabelOldPrimary
                    - compensateLabelTargetSecondary
                    - compensateFinalize
                    - retireOldReplica
                    - openCandidate
                    - updateCandidateEpoch
                    - assignCandidateIdle
                    - buildCandidate
                    - assignCandidateActive
                    - addCatchUpConfiguration
                    - addWaitForCatchUpQuorum
                    - addCurrentConfiguration
                    - labelCandidateSecondary
                    - addFinalize
                    - compensateRestoreConfiguration
                    - compensateRemoveCandidate
                    - compensateDemoteCandidate
                    - compensateCloseCandidate
                    - compensateDeleteCandidate
                    - addCompensateFinalize
                    - completed
                    - failed
                    - poisoned
                  previousSnapshot:
                    type: object
                    required:
                    - epoch
                    - primaryId
                    - members
                    - writeQuorum
                    properties:
                      epoch:
                        type: object
                        required:
                        - dataLossNumber
                        - configurationNumber
                        properties:
                          dataLossNumber:
                            type: integer
                            format: int64
                          configurationNumber:
                            type: integer
                            format: int64
                      primaryId:
                        type: integer
                        format: int64
                      members:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - instanceId
                          - role
                          properties:
                            id:
                              type: integer
                              format: int64
                            instanceId:
                              type: string
                            role:
                              type: string
                              enum:
                              - primary
                              - activeSecondary
                      writeQuorum:
                        type: integer
                        format: uint32
                  targetSnapshot:
                    type: object
                    required:
                    - epoch
                    - primaryId
                    - members
                    - writeQuorum
                    properties:
                      epoch:
                        type: object
                        required:
                        - dataLossNumber
                        - configurationNumber
                        properties:
                          dataLossNumber:
                            type: integer
                            format: int64
                          configurationNumber:
                            type: integer
                            format: int64
                      primaryId:
                        type: integer
                        format: int64
                      members:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - instanceId
                          - role
                          properties:
                            id:
                              type: integer
                              format: int64
                            instanceId:
                              type: string
                            role:
                              type: string
                              enum:
                              - primary
                              - activeSecondary
                      writeQuorum:
                        type: integer
                        format: uint32
                  oldPrimaryId:
                    type: integer
                    format: int64
                  targetPrimaryId:
                    type: integer
                    format: int64
                  addMode:
                    type: string
                    enum:
                    - scaleUp
                    - rebuild
                  targetReplicaId:
                    type: integer
                    format: int64
                  targetInstanceId:
                    type: string
                  targetPodName:
                    type: string
                  retiredInstanceId:
                    type: string
                  frozenLsn:
                    type: integer
                    format: int64
                  nextSecondaryIndex:
                    type: integer
                    format: uint32
                  phaseDeadlineUnixSeconds:
                    type: integer
                    format: int64
                  lastError:
                    type: string
                    maxLength: 512
                  pendingAction:
                    type: object
                    required:
                    - actionId
                    - sequence
                    - kind
                    - targetId
                    - targetInstanceId
                    - expectedEpoch
                    - desiredPostcondition
                    - attempts
                    - deadlineUnixSeconds
                    properties:
                      actionId:
                        type: string
                      sequence:
                        type: integer
                        format: uint32
                      kind:
                        type: string
                        enum:
                        - revokeWrite
                        - demoteOldPrimary
                        - promoteTarget
                        - updateSecondaryEpoch
                        - updateCatchUpConfiguration
                        - waitForCatchUpQuorum
                        - updateCurrentConfiguration
                        - labelTargetPrimary
                        - labelOldSecondary
                        - restorePreviousConfiguration
                        - compensatePromoteOldPrimary
                        - compensateUpdateSecondaryEpoch
                        - compensateCatchUpConfiguration
                        - compensateCurrentConfiguration
                        - compensateLabelOldPrimary
                        - compensateLabelTargetSecondary
                        - retireOldReplica
                        - openCandidate
                        - updateCandidateEpoch
                        - assignCandidateIdle
                        - buildCandidate
                        - assignCandidateActive
                        - addCatchUpConfiguration
                        - addWaitForCatchUpQuorum
                        - addCurrentConfiguration
                        - labelCandidateSecondary
                        - compensateRestoreConfiguration
                        - compensateRemoveCandidate
                        - compensateDemoteCandidate
                        - compensateCloseCandidate
                        - compensateDeleteCandidate
                      targetId:
                        type: integer
                        format: int64
                      targetInstanceId:
                        type: string
                      expectedEpoch:
                        type: object
                        required:
                        - dataLossNumber
                        - configurationNumber
                        properties:
                          dataLossNumber:
                            type: integer
                            format: int64
                          configurationNumber:
                            type: integer
                            format: int64
                      desiredPostcondition:
                        type: object
                        required:
                        - kind
                        properties:
                          kind:
                            type: string
                            enum:
                            - writeRevoked
                            - role
                            - epoch
                            - catchUpConfiguration
                            - catchUpQuorum
                            - currentConfiguration
                            - podRoleLabel
                            - opened
                            - buildCompleted
                            - replicaRemoved
                            - closed
                            - podDeleted
                          role:
                            type: string
                            enum:
                            - primary
                            - activeSecondary
                      attempts:
                        type: integer
                        format: uint32
                      deadlineUnixSeconds:
                        type: integer
                        format: int64
                      lastError:
                        type: string
                        maxLength: 512
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                      maxLength: 512
                    lastTransitionTime:
                      type: string
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Replicas
      type: integer
      jsonPath: .spec.replicas
    - name: Ready
      type: integer
      jsonPath: .status.readyReplicas
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Primary
      type: string
      jsonPath: .status.currentPrimary
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberic-operator
  namespace: xedio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberic-operator
rules:
- apiGroups: ["kuberic.io"]
  resources: ["kubericsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kuberic.io"]
  resources: ["kubericsets/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["kuberic.io"]
  resources: ["kubericsets/finalizers"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberic-operator
subjects:
- kind: ServiceAccount
  name: kuberic-operator
  namespace: xedio
roleRef:
  kind: ClusterRole
  name: kuberic-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberic-operator
  namespace: xedio
  labels:
    app: kuberic-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuberic-operator
  template:
    metadata:
      labels:
        app: kuberic-operator
    spec:
      serviceAccountName: kuberic-operator
      containers:
      - name: operator
        image: localhost/kuberic-operator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
