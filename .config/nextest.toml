[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
retries = 0
test-threads = 4

[profile.ci]
inherits = "default"
fail-fast = false
retries = 0
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.ordinary]
inherits = "ci"
default-filter = 'not package(=postgres-replicated) and not binary(=kubernetes_checkpoint_real) and not binary_id(=kuberic-runtime::public_api_privacy)'

[profile.build-only]
inherits = "ci"
default-filter = 'binary_id(=kuberic-runtime::public_api_privacy)'
test-threads = 1

[profile.postgres]
inherits = "ci"
default-filter = 'package(=postgres-replicated)'
test-threads = 1

[profile.kind]
inherits = "ci"
default-filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(adversarial_restart_partition_and_healing_preserve_single_writer|bootstrap_reaches_three_member_topology_and_quorum_write|failover_fences_old_primary_and_preserves_committed_data|planned_switchover(_adversarial)?|quorum_loss_closes_writes_and_recovers_without_data_loss_epoch_change|replacement_preserves_quorum_write_and_retires_old_incarnation|scale_down(_non_contiguous|_adversarial_(historical|reachable|unreachable|absent_pod))?|scale_up(_multi|_adversarial_(cancellation|pre_admission_failover|post_admission_recovery|non_contiguous_restore))?)$/)'
test-threads = 1

[profile.dex-live]
inherits = "ci"
default-filter = 'binary(=kubernetes_checkpoint_real)'
test-threads = 1

[profile.helper]
inherits = "ci"
default-filter = '(binary_id(=kuberic-runtime) and test(/^host::tests::(crash_boundaries|recovery)::/)) or binary_id(=kuberic-controller::model) or binary_id(=postgres-replicated::native_durable) or binary_id(=postgres-replicated::validation_oracles)'
test-threads = 1

[test-groups]
postgres = { max-threads = 1 }
sqlite = { max-threads = 1 }
process-boundaries = { max-threads = 1 }
kind-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=postgres-replicated)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'package(=sqlite-replicated)'
test-group = 'sqlite'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime::public_v1_conformance) and test(=built_in_preview_ksf_mappings_require_each_authorized_observation)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime::public_v1_conformance) and test(=public_v1_conformance_executes_strict_and_hosted_preview_scenarios)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime) and test(/^host::tests::(crash_boundaries|recovery)::/)'
test-group = 'process-boundaries'
threads-required = 4

[[profile.default.overrides]]
filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(adversarial_restart_partition_and_healing_preserve_single_writer|bootstrap_reaches_three_member_topology_and_quorum_write|failover_fences_old_primary_and_preserves_committed_data|planned_switchover(_adversarial)?|quorum_loss_closes_writes_and_recovers_without_data_loss_epoch_change|replacement_preserves_quorum_write_and_retires_old_incarnation|scale_down(_non_contiguous|_adversarial_(historical|reachable|unreachable|absent_pod))?|scale_up(_multi|_adversarial_(cancellation|pre_admission_failover|post_admission_recovery|non_contiguous_restore))?)$/)'
test-group = 'kind-live'
