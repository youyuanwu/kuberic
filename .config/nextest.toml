[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
retries = 0
test-threads = 4
slow-timeout = { period = "270s", terminate-after = 1 }

[profile.ci]
inherits = "default"
fail-fast = false
retries = 0
slow-timeout = { period = "270s", terminate-after = 1 }

[profile.ci.archive]
include = [
    { path = "debug/postgres-replicated", relative-to = "target", on-missing = "ignore" },
    { path = "x86_64-unknown-linux-gnu/debug/postgres-replicated", relative-to = "target", on-missing = "ignore" },
]

[profile.ordinary]
inherits = "ci"
default-filter = '''
not package(=postgres-replicated) and not (
    binary_id(=kuberic-runtime::public_api_inventory)
    or binary_id(=kuberic-runtime::public_api_privacy)
    or binary_id(=kuberic-runtime::lifecycle_capability_boundaries)
    or binary_id(=kuberic-runtime::public_v1_conformance)
    or (binary_id(=kuberic-runtime)
        and test(/^testing::public_v1_conformance::bounded_process_tests::/))
    or (binary_id(=kuberic-runtime::public_v1_evidence)
        and test(=public_v1_source_uses_no_native_evidence))
    or (binary_id(=kuberic-runtime::public_v1_recovery)
        and test(=production_config_has_no_protocol_selector_or_application_commit_oracle))
    or (binary_id(=kuberic-controller)
        and test(=cluster_api::tests::production_kubernetes_api_requires_one_exact_namespace))
    or (binary_id(=kuberic-controller::public_api)
        and test(/^(crdgen_preserves_public_v1_only_typed_status|shipped_sample_matches_ordinary_hosting_format|deployment_sources_installation_namespace_from_metadata_namespace_only|deployment_prevents_concurrent_controller_reconciliation|production_inventory_contains_only_public_v1_controller_surfaces)$/))
    or (binary_id(=kvstore2::bin/kvstore2)
        and test(/^tests::(application_main_uses_the_agent_host_instead_of_protocol_internals|default_manifest_neither_enables_nor_routes_live_test_gate)$/))
    or (binary_id(=sqlite-replicated::bin/sqlite-replicated)
        and test(=tests::startup_uses_replica_host_and_has_no_demo_surface))
    or (binary_id(=kuberic-level-tests::source_checks)
        and test(=packaged_controller_test_util_boundary))
)
'''

[profile.source]
inherits = "ci"
default-filter = '''
binary_id(=kuberic-runtime::public_api_inventory)
or binary_id(=kuberic-runtime::public_api_privacy)
or binary_id(=kuberic-runtime::lifecycle_capability_boundaries)
or binary_id(=kuberic-runtime::public_v1_conformance)
or (binary_id(=kuberic-runtime)
    and test(/^testing::public_v1_conformance::bounded_process_tests::/))
or (binary_id(=kuberic-runtime::public_v1_evidence)
    and test(=public_v1_source_uses_no_native_evidence))
or (binary_id(=kuberic-runtime::public_v1_recovery)
    and test(=production_config_has_no_protocol_selector_or_application_commit_oracle))
or (binary_id(=kuberic-controller)
    and test(=cluster_api::tests::production_kubernetes_api_requires_one_exact_namespace))
or (binary_id(=kuberic-controller::public_api)
    and test(/^(crdgen_preserves_public_v1_only_typed_status|shipped_sample_matches_ordinary_hosting_format|deployment_sources_installation_namespace_from_metadata_namespace_only|deployment_prevents_concurrent_controller_reconciliation|production_inventory_contains_only_public_v1_controller_surfaces)$/))
or (binary_id(=kvstore2::bin/kvstore2)
    and test(/^tests::(application_main_uses_the_agent_host_instead_of_protocol_internals|default_manifest_neither_enables_nor_routes_live_test_gate)$/))
or (binary_id(=sqlite-replicated::bin/sqlite-replicated)
    and test(=tests::startup_uses_replica_host_and_has_no_demo_surface))
or (binary_id(=kuberic-level-tests::source_checks)
    and test(=packaged_controller_test_util_boundary))
'''
test-threads = 1

# Compatibility alias: source checks require a checkout, not an archive-only runner.
[profile.build-only]
inherits = "source"

[[profile.source.overrides]]
filter = 'binary_id(=kuberic-level-tests::source_checks) and test(=packaged_controller_test_util_boundary)'
slow-timeout = { period = "20m", terminate-after = 1 }

[[profile.source.overrides]]
filter = 'binary_id(=kuberic-runtime::public_api_privacy)'
slow-timeout = { period = "20m", terminate-after = 1 }

[profile.postgres]
inherits = "ci"
default-filter = 'package(=postgres-replicated)'
test-threads = 1

[profile.kind]
inherits = "ci"
default-filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(bootstrap_reaches_three_member_topology_and_quorum_write|replacement_preserves_quorum_write_and_retires_old_incarnation|failover_fences_old_primary_and_preserves_committed_data)$/)'
test-threads = 1

[test-groups]
postgres = { max-threads = 1 }
sqlite = { max-threads = 1 }
process-boundaries = { max-threads = 1 }
kind-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=postgres-replicated)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'package(=sqlite-replicated)'
test-group = 'sqlite'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime::public_v1_conformance) and test(=built_in_replacement_ksf_mappings_require_each_authorized_observation)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime::public_v1_conformance) and test(/^public_v1_conformance_executes_/)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime) and test(/^testing::public_v1_conformance::bounded_process_tests::/)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime) and test(=host::sqlite_store::tests::removed_ingress_fields_reject_before_metadata_mutation)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(bootstrap_reaches_three_member_topology_and_quorum_write|replacement_preserves_quorum_write_and_retires_old_incarnation|failover_fences_old_primary_and_preserves_committed_data)$/)'
test-group = 'kind-live'
