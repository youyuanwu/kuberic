[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
retries = 0
test-threads = 4

[profile.ci]
inherits = "default"
fail-fast = false
retries = 0
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.ordinary]
inherits = "ci"
default-filter = 'not package(=postgres-replicated) and not binary(=kubernetes_checkpoint_real) and not binary_id(=kuberic-runtime::public_api_privacy)'

[profile.build-only]
inherits = "ci"
default-filter = 'binary_id(=kuberic-runtime::public_api_privacy) or (binary_id(=kuberic-runtime::public_v1_conformance) and test(=public_v1_conformance_executes_built_in_replacement_scenarios))'
test-threads = 1

[profile.postgres]
inherits = "ci"
default-filter = 'package(=postgres-replicated)'
test-threads = 1

[profile.kind]
inherits = "ci"
default-filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(bootstrap_reaches_three_member_topology_and_quorum_write|replacement_preserves_quorum_write_and_retires_old_incarnation|failover_fences_old_primary_and_preserves_committed_data)$/)'
test-threads = 1

[profile.dex-live]
inherits = "ci"
default-filter = 'binary(=kubernetes_checkpoint_real)'
test-threads = 1

[test-groups]
postgres = { max-threads = 1 }
sqlite = { max-threads = 1 }
process-boundaries = { max-threads = 1 }
kind-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=postgres-replicated)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'package(=sqlite-replicated)'
test-group = 'sqlite'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime::public_v1_conformance) and test(=built_in_replacement_ksf_mappings_require_each_authorized_observation)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime::public_v1_conformance) and test(=public_v1_conformance_executes_built_in_replacement_scenarios)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-runtime) and test(=host::sqlite_store::tests::terminal_inbound_build_receipt_reopens_for_exact_replay_only)'
slow-timeout = { period = "270s", terminate-after = 1 }
test-group = 'process-boundaries'

[[profile.default.overrides]]
filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(bootstrap_reaches_three_member_topology_and_quorum_write|replacement_preserves_quorum_write_and_retires_old_incarnation|failover_fences_old_primary_and_preserves_committed_data)$/)'
test-group = 'kind-live'
