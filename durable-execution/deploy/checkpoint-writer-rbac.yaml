# Example namespace-scoped identity for the Kubernetes checkpoint data path.
# Create the namespace separately and replace names to match your deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberic-checkpoint-writer
  namespace: kuberic-checkpoints
  annotations:
    kuberic.io/checkpoint-lifecycle: retained-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberic-checkpoint-writer
  namespace: kuberic-checkpoints
  annotations:
    kuberic.io/checkpoint-lifecycle: retained-writer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberic-checkpoint-writer
  namespace: kuberic-checkpoints
  annotations:
    kuberic.io/checkpoint-lifecycle: retained-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberic-checkpoint-writer
subjects:
  - kind: ServiceAccount
    name: kuberic-checkpoint-writer
    namespace: kuberic-checkpoints
