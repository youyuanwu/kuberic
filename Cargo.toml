[workspace]
resolver = "2"
members = ["kuberic-fm", "kuberic-controller", "kuberic-tests", "kuberic-kind-tests"]
exclude = ["archive", "fube"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
fube-local-host = { path = "fube/crates/libs/fube-local-host" }
fube-node = { path = "fube/crates/libs/fube-node" }
fube-node-runner = { path = "fube/crates/tools/fube-node-runner" }
fube-ra = { path = "fube/crates/libs/fube-ra" }
fube-transport = { path = "fube/crates/libs/fube-transport" }
kuberic-fm = { path = "kuberic-fm" }
kuberic-controller = { path = "kuberic-controller" }
k8s-openapi = { version = "0.28", features = ["v1_32", "schemars"] }
kube = { version = "4", default-features = false, features = ["client", "derive", "rustls-tls"] }
schemars = "1"
