[package]
name = "external-classic-v1-provider"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
kuberic-runtime = { path = "../../../kuberic-runtime", default-features = false, features = ["host"] }
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
tonic = "0.14"
