[package]
name = "downstream-controller-test-util"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["harness"]
harness = ["kuberic-controller/test-util"]
process-members = ["harness", "dep:rusqlite"]
all-controller = ["harness", "kuberic-controller/runtime-test-bridge"]

[dependencies]
kuberic-runtime = { version = "=0.0.1", features = ["testing"] }
kuberic-controller = "=0.0.1"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "feature-off"
path = "src/feature_off.rs"

[[bin]]
name = "private"
path = "src/private.rs"

[[bin]]
name = "conformance"
path = "src/conformance.rs"

[[bin]]
name = "kuberic-counter-member"
path = "src/counter_member.rs"
required-features = ["harness"]
test = false

[[bin]]
name = "kuberic-retained-counter-member"
path = "src/retained_counter_member.rs"
required-features = ["process-members"]
test = false
