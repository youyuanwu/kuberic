[package]
name = "ordinary21-owner-recovery"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
kuberic-runtime = { version = "=0.0.1", default-features = false, features = ["host"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(feature, values("harness", "process-members"))'] }

[[bin]]
name = "ordinary21-owner-recovery"
path = "src/main.rs"
test = false
bench = false
