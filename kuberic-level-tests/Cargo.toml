[package]
name = "kuberic-level-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-process and isolated KinD integration tests for the level-triggered Kuberic stack"
publish = false

[features]
default = ["harness"]
harness = []
process-members = ["harness", "dep:kvstore2", "dep:sqlite-replicated", "dep:rusqlite", "dep:tonic"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
kuberic-controller = { workspace = true, features = ["test-util"] }
kuberic-runtime = { workspace = true, features = ["host", "testing"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
kvstore2 = { path = "../examples/kvstore2", features = ["testing"], optional = true }
sqlite-replicated = { path = "../examples/sqlite", features = ["testing"], optional = true }
rusqlite = { workspace = true, features = ["serialize"], optional = true }
tonic = { workspace = true, optional = true }

[dev-dependencies]
http = "1"
k8s-openapi.workspace = true
kube.workspace = true
kvstore2 = { path = "../examples/kvstore2", features = ["testing"] }
tempfile = "3"
tonic.workspace = true

[[bin]]
name = "kuberic-counter-member"
path = "src/counter_member.rs"
required-features = ["harness"]
test = false

[[bin]]
name = "kuberic-retained-counter-member"
path = "src/retained_counter_member.rs"
required-features = ["process-members"]
test = false

[[bin]]
name = "kuberic-retained-kv-member"
path = "src/retained_kv_member.rs"
required-features = ["process-members"]
test = false

[[bin]]
name = "kuberic-retained-sqlite-member"
path = "src/retained_sqlite_member.rs"
required-features = ["process-members"]
test = false
