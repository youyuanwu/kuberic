[package]
name = "kuberic-level-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-process and isolated KinD integration tests for the level-triggered Kuberic stack"
publish = false

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
http = "1"
form_urlencoded = "1"
k8s-openapi.workspace = true
kube.workspace = true
kuberic-controller.workspace = true
kuberic-runtime = { workspace = true, features = ["host", "testing"] }
kvstore2 = { path = "../examples/kvstore2", features = ["testing"] }
tonic.workspace = true
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true, features = ["v4"] }
