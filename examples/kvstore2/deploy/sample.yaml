apiVersion: operator.kuberic.io/v1alpha1
kind: KubericSet
metadata:
  name: kvstore2
spec:
  replicas: 3
  # Protocol 6 / agent store schema 2: use a fresh coordinated deployment.
  # After Ready, lower replicas to 2, then 1 for secondary-only scale-down.
  # PVC object deletion: no retention/import path; not a physical-erasure guarantee.
  # A singleton has no redundancy; scale-up and active cancellation are unsupported.
  image: localhost/kvstore2:level-triggered-v1
  failoverDelaySeconds: 10
  # Optional: submit only after Ready, selecting a committed non-primary ID.
  # Use a fresh request ID for each movement; keep an active request unchanged.
  # switchover:
  #   requestId: move-to-replica-2-001
  #   targetReplicaId: 2
